version: "2"
cloud:
    organization: ""
    project: ""
    hostname: ""
servers: []
sql:
  - engine: "postgresql"
    schema: "./database/migrations"
    queries: "./database/queries"
    gen:
      go:
        emit_json_tags: true                 # Ensures JSON tags are included for structs
        emit_empty_slices: true              # Ensures empty slices are correctly handled
        emit_prepared_queries: true          # Enables prepared queries
        emit_pointers_for_null_types: true
        emit_interface: true
        package: "repository"                # The Go package name for generated code
        out: "internal/repository"           # The output directory for generated code
        sql_package: "pgx/v5"                # The SQL package to use for Postgres queries
        overrides:
          # UUID mapping
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # TIMESTAMPTZ (timestamp with time zone)
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamp with time zone"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp with time zone"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # TIMESTAMP (timestamp without time zone)
          - db_type: "timestamp"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamp without time zone"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp without time zone"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "int"
              pointer: true
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type:
              type: "int"
              pointer: false 
