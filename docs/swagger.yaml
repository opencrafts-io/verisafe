externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: qaverisafe.opencrafts.io
info:
  contact:
    email: developers@opencrafts.io
    name: Open Crafts Interactive
    url: https://opencrafts.io/about
  description: Verisafe service API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Verisafe API
  version: "2.0"
paths:
  /accounts/all:
    get:
      description: 'Note: this route is not wired with pagination middleware, so limit/offset
        query params are currently ignored — it always returns the first page (10
        accounts).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.Account'
            type: array
        "500":
          description: Failed to fetch accounts
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List all accounts
      tags:
      - accounts
  /accounts/bot/create:
    post:
      consumes:
      - application/json
      description: Creates a service (bot) account, assigns it the "bot" role, and
        issues a service token for it in one call.
      parameters:
      - description: Bot account and service token details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BotAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.BotAccountResponse'
        "400":
          description: Invalid request body, or missing required fields
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to create account, assign role, or issue service token
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Create a bot account with a service token
      tags:
      - accounts
  /accounts/deletion-request:
    post:
      description: The account is soft-deleted and permanently removed after a 14-day
        grace period; signing in again before then cancels the deletion.
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to mark account for deletion
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Request deletion of the authenticated user's own account
      tags:
      - accounts
  /accounts/fanout:
    get:
      description: Batches through all accounts and republishes a UserCreated event
        for each, via a worker pool. Intended for backfilling downstream consumers,
        not routine use.
      produces:
      - application/json
      responses:
        "200":
          description: Publish count message
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to read accounts or publish one or more batches
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Republish every account to the event bus
      tags:
      - accounts
  /accounts/me:
    get:
      description: Returns the account belonging to the caller's own JWT/API-key subject.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Account'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch account
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Get the authenticated user's own account
      tags:
      - accounts
    patch:
      consumes:
      - application/json
      description: The request body's id must match the caller's own subject — updating
        a different account's id is rejected.
      parameters:
      - description: Account fields to update; id must be the caller's own
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/repository.UpdateAccountDetailsParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Account'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Not the account owner, or failed to update/fetch account
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Update the authenticated user's own account details
      tags:
      - accounts
  /accounts/me/phone:
    patch:
      consumes:
      - application/json
      description: 'The request body''s id must match the caller''s own subject. Note:
        this only updates the stored phone number today — it does not yet verify it
        (see TODO below).'
      parameters:
      - description: New phone number; id must be the caller's own
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/repository.UpdateAccountPhoneNumberParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Account'
        "400":
          description: Invalid request body or phone number too short
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Not the account owner, or failed to update/fetch account
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Update the authenticated user's own phone number
      tags:
      - accounts
  /accounts/recovery:
    post:
      description: Restores full access to an account that was previously marked for
        deletion, provided it's still within the 14-day grace period.
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to recover account
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Cancel a pending deletion of the authenticated user's own account
      tags:
      - accounts
  /accounts/search/email:
    get:
      description: Case-sensitivity and match semantics follow the underlying SQL
        query.
      parameters:
      - description: Email search query
        in: query
        name: q
        required: true
        type: string
      - description: Page size (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: accounts, pagination, query, search_type
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing query parameter 'q'
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Search failed
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Search accounts by email
      tags:
      - accounts
  /accounts/search/name:
    get:
      parameters:
      - description: Name search query
        in: query
        name: q
        required: true
        type: string
      - description: Page size (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: accounts, pagination, query, search_type
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing query parameter 'q'
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Search failed
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Search accounts by name
      tags:
      - accounts
  /accounts/search/username:
    get:
      parameters:
      - description: Username search query
        in: query
        name: q
        required: true
        type: string
      - description: Page size (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: accounts, pagination, query, search_type
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing query parameter 'q'
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Search failed
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Search accounts by username
      tags:
      - accounts
  /activity/{id}:
    delete:
      description: 'Note: Activity is a shared catalog resource with no per-user owner
        — this route only checks IsAuthenticated today, with no admin-style permission
        gate (see ADR 0006 for the planned fix).'
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to delete activity
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Delete an activity definition
      tags:
      - activities
    patch:
      consumes:
      - application/json
