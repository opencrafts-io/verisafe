      - streaks
  /users/activity/completions/for-user/{id}:
    get:
      description: 'Note: any authenticated caller can view any other user''s activity
        completions by id — there is no ownership check on this endpoint today.'
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pagination.PaginatedResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch completions
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
