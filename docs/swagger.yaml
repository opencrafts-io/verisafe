            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Revoke a service token
      tags:
      - service-tokens
    get:
      description: Requires read:service_token:own for the caller's own tokens, or
        read:service_token:any to read any account's token.
      parameters:
      - description: Service token ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/servicetoken.ServiceTokenResponse'
        "400":
          description: Invalid token
          schema:
            $ref: '#/definitions/core.APIError'
        "403":
          description: Not the token owner and not an admin
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Service token not found
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch service token
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Get a service token by id
      tags:
      - service-tokens
    put:
      consumes:
      - application/json
      description: Requires update:service_token:own for the caller's own tokens,
        or update:service_token:any to update any account's token.
      parameters:
      - description: Service token ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/servicetoken.ServiceTokenUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/servicetoken.ServiceTokenResponse'
        "400":
          description: Invalid id or request body
          schema:
            $ref: '#/definitions/core.APIError'
        "403":
          description: Not the token owner and not an admin
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Service token not found
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to update service token
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Update a service token
      tags:
      - service-tokens
