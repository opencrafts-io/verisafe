  /socials/user/{user_id}:
    get:
      description: Provider access and refresh tokens are never included; those are
        brokered through /oauth/{provider}/token instead.
      parameters:
      - description: Account ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.socialResponse'
            type: array
        "400":
          description: Invalid user_id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch social connections
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List a given user's linked social accounts
      tags:
      - socials
  /streaks/milestone/{id}:
