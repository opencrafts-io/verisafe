  /permissions/assign/{perm_id}/{role_id}:
    get:
      description: |-
        Attaches a permission to a role, granting it to every account
        that holds the role. Not idempotent: role_permissions is keyed
        on (role_id, permission_id), so re-granting a permission the
        role already holds fails the primary key and returns 500.
        Requires the assign:permission:role permission.
      parameters:
      - description: Permission ID
        in: path
        name: perm_id
        required: true
        type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid perm_id or role_id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to assign permission
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Grant a permission to a role
      tags:
      - permissions
  /permissions/create:
    post:
      consumes:
      - application/json
      description: Newly created permissions are automatically granted to the "system"
        and "Administrator" roles by database triggers — see docs/RBAC.md.
      parameters:
      - description: Permission to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/repository.CreatePermissionParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.Permission'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to create permission
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Create a permission
      tags:
      - permissions
  /permissions/revoke/{perm_id}/{role_id}:
    delete:
      description: |-
        Detaches a permission from a role, withdrawing it from every
        account that held it only through this role. Accounts holding
        the same permission via another role keep it.
        Requires the revoke:permission:role permission.
      parameters:
      - description: Permission ID
        in: path
        name: perm_id
        required: true
        type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid perm_id or role_id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to revoke permission
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Revoke a permission from a role
      tags:
      - permissions
  /permissions/user/{id}:
    get:
      description: |-
        Returns the permissions the account effectively holds, resolved
        through every role assigned to it. Permissions are never
        attached to an account directly, only via a role.
        Requires the read:permission:user permission.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.UserPermissionsView'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch permissions
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List a given user's effective permissions
      tags:
      - permissions
  /ping:
    get:
      description: |-
        Returns 200 with a fixed message whenever the process is
        serving. This is a liveness check only: it does not touch the
        database, Redis, or RabbitMQ, so a 200 here does not imply any
        dependency is reachable. Unauthenticated by design.
      produces:
      - application/json
      responses:
        "200":
          description: Fixed liveness message
          schema:
            additionalProperties: true
            type: object
      summary: Liveness probe
      tags:
      - health
  /plans:
    get:
      description: Returns billing plans, optionally filtered by visibility.
      parameters:
      - description: Filter by visibility
        in: query
        name: visible
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/billing.Plan'
            type: array
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch plans
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List billing plans
      tags:
      - plans
    post:
      consumes:
      - application/json
      description: Creates a new billing plan. The authenticated caller is recorded
        as the plan's creator.
      parameters:
      - description: Plan to create
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/billing.CreatePlan'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/billing.Plan'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "409":
          description: Plan with this code already exists
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to create plan
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Create a billing plan
      tags:
      - plans
  /plans/{code}:
    get:
      description: Returns a single billing plan matching the given plan code.
      parameters:
      - description: Plan code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.Plan'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Plan not found
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch plan
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Get a billing plan by code
      tags:
      - plans
    patch:
      consumes:
      - application/json
      description: Updates fields on an existing billing plan identified by its code.
        Only provided fields are updated.
      parameters:
      - description: Plan code
        in: path
        name: code
        required: true
        type: string
      - description: Fields to update
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/billing.UpdatePlan'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.Plan'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Plan not found
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to update plan
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Update a billing plan
      tags:
      - plans
  /roles:
    get:
      description: |-
        Returns a paginated list of every role defined in the system.
        Paginated with limit/offset; the response is a bare array, not
        an envelope.
        Requires the read:role:any permission.
      parameters:
      - description: Page size (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.Role'
            type: array
        "500":
          description: Failed to fetch roles
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List roles
      tags:
      - roles
  /roles/{id}:
    get:
      description: |-
        Returns a single role by its UUID. Responds 404 when no role
        carries that id.
        Requires the read:role:any permission.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Role'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch role
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Get a role by id
      tags:
      - roles
    patch:
      consumes:
      - application/json
      description: The path id is the authoritative resource identifier — any id in
        the request body is overwritten with it.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/repository.UpdateRoleParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Role'
        "400":
          description: Invalid id or request body
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to update role
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Update a role
      tags:
      - roles
  /roles/assign/{user_id}/{role_id}:
    get:
      description: |-
        Grants a role to an account, transitively granting the account
        every permission that role holds. Not idempotent: user_roles is
        keyed on (user_id, role_id), so re-assigning a role the account
        already holds fails the primary key and returns 500.
        Requires the assign:role:any permission.
      parameters:
      - description: Account ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user_id or role_id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to assign role
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Assign a role to a user
      tags:
      - roles
  /roles/create:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new role. Roles are the unit RBAC permissions attach
        to: assigning a role to an account grants that account every
        permission the role holds.
        Requires the create:role permission.
      parameters:
      - description: Role to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/repository.CreateRoleParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.Role'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to create role
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Create a role
      tags:
      - roles
  /roles/permissions/{id}:
    get:
      description: |-
        Returns every permission attached to the given role. These are
        the permissions an account inherits when the role is assigned
        to it.
        Requires the read:role:permissions permission.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.RolePermissionsView'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch permissions
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List permissions granted to a role
      tags:
      - roles
  /roles/revoke/{user_id}/{role_id}:
    delete:
      description: |-
        Removes a role from an account, withdrawing every permission
        the account held only through that role. Permissions the
        account also holds via another role are unaffected.
        Requires the revoke:role:any permission.
      parameters:
      - description: Account ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Role ID
        in: path
        name: role_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user_id or role_id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to revoke role
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Revoke a role from a user
      tags:
      - roles
  /roles/user/{id}:
    get:
      description: |-
        Returns every role currently assigned to the given account.
        Requires the read:role:any permission.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.UserRolesView'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to fetch roles
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List a given user's roles
      tags:
      - roles
  /socials/me:
