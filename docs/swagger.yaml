basePath: /
definitions:
  auth.authCodeExchangeRequest:
    properties:
      code:
        type: string
    type: object
  auth.refreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.revokeTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.tokenResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  core.APIError:
    properties:
      error:
        example: the provided input is invalid or malformed
        type: string
    type: object
  handlers.BotAccountRequest:
    properties:
      account:
        properties:
          avatar_url:
            type: string
          email:
            type: string
          name:
            maxLength: 100
            minLength: 1
            type: string
        required:
        - email
        - name
        type: object
      service_token:
        properties:
          description:
            type: string
          expires_in_days:
            maximum: 3650
            minimum: 1
            type: integer
          ip_whitelist:
            items:
              type: string
            type: array
          max_uses:
            minimum: 1
            type: integer
          metadata:
            additionalProperties: {}
            type: object
          name:
            maxLength: 100
            minLength: 1
            type: string
          rotation_policy:
            $ref: '#/definitions/handlers.RotationPolicy'
          scopes:
            items:
              type: string
            type: array
          user_agent_pattern:
            type: string
        required:
        - name
        type: object
    type: object
  handlers.BotAccountResponse:
    properties:
      account:
        properties:
          created_at:
            type: string
          email:
            type: string
          id:
            type: string
          name:
            type: string
          type:
            type: string
        type: object
      service_token:
        properties:
          created_at:
            type: string
          description:
            type: string
          expires_at:
            type: string
          id:
            type: string
          max_uses:
            type: integer
          metadata:
            additionalProperties: {}
            type: object
          name:
            type: string
          scopes:
            items:
              type: string
            type: array
          token:
            type: string
        type: object
    type: object
  handlers.RotationPolicy:
    properties:
      auto_rotate:
        type: boolean
      notify_before_days:
        maximum: 30
        minimum: 1
        type: integer
      rotation_interval_days:
        maximum: 365
        minimum: 1
        type: integer
    type: object
  handlers.ServiceTokenRequest:
    properties:
      description:
        type: string
      expires_in_days:
        description: Max 10 years
        maximum: 3650
        minimum: 1
        type: integer
      ip_whitelist:
        items:
          type: string
        type: array
      max_uses:
        minimum: 1
        type: integer
      metadata:
        additionalProperties: true
        type: object
      name:
        maxLength: 100
        minLength: 1
        type: string
      rotation_policy:
        $ref: '#/definitions/handlers.RotationPolicy'
      scopes:
        items:
          type: string
        type: array
      user_agent_pattern:
        type: string
    required:
    - name
    type: object
  handlers.ServiceTokenResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      max_uses:
        type: integer
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      revoked_at:
        type: string
      rotated_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      token:
        description: Only included on creation
        type: string
      use_count:
        type: integer
    type: object
  handlers.ServiceTokenStats:
    properties:
      active_tokens:
        type: integer
      expired_tokens:
        type: integer
      recently_used_tokens:
        type: integer
      revoked_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  handlers.ServiceTokenUpdateRequest:
    properties:
      description:
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      max_uses:
