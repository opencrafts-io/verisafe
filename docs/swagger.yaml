        "400":
          description: Missing or malformed code
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to retrieve auth code
          schema:
            $ref: '#/definitions/core.APIError'
      summary: Exchange a mobile auth code for a token pair
