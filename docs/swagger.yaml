  /auth/{provider}:
    get:
      description: Redirects the client to the given OAuth2 provider to begin a login.
        Omit "platform" (or pass anything other than "web") for the mobile flow. Pass
        platform=web with a redirect_uri that's in the server-side allowlist for the
        web flow.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        - apple
        in: path
        name: provider
        required: true
        type: string
      - description: Set to 'web' for the web flow; omitted defaults to mobile
        in: query
        name: platform
        type: string
      - description: Required when platform=web; must be in the configured allowlist
        in: query
        name: redirect_uri
        type: string
      - description: Mobile deep link to redirect to after login, e.g. myapp://auth/callback
        in: query
        name: deep_link
        type: string
      - description: Device name to register on successful login
        in: query
        name: device_name
        type: string
      - description: Push notification token to register on successful login
        in: query
        name: device_token
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to the OAuth2 provider
        "400":
          description: Missing provider, or missing/disallowed redirect_uri
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to initiate login with the provider
          schema:
            $ref: '#/definitions/core.APIError'
      summary: Start OAuth2 login
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      description: Completes an OAuth2 login started by LoginHandler. Not called directly
        by clients — the provider redirects here (Apple posts via application/x-www-form-urlencoded).
        On success, redirects to redirect_uri with cookies set (web) or to the deep
        link with a one-time opaque code (mobile).
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        - apple
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to redirect_uri (web) or the deep link (mobile)
        "400":
          description: Missing provider or malformed/missing state
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: OAuth flow, database, or token issuance failure
          schema:
            $ref: '#/definitions/core.APIError'
      summary: OAuth2 provider callback
      tags:
      - auth
    post:
      description: Completes an OAuth2 login started by LoginHandler. Not called directly
        by clients — the provider redirects here (Apple posts via application/x-www-form-urlencoded).
        On success, redirects to redirect_uri with cookies set (web) or to the deep
        link with a one-time opaque code (mobile).
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        - apple
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to redirect_uri (web) or the deep link (mobile)
        "400":
          description: Missing provider or malformed/missing state
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: OAuth flow, database, or token issuance failure
          schema:
            $ref: '#/definitions/core.APIError'
      summary: OAuth2 provider callback
      tags:
      - auth
  /auth/{provider}/logout:
    get:
      description: Clears the goth/gothic OAuth2 session for the given provider. This
        is not the same as token revocation — call RevokeTokenHandler too if the client
        also wants to invalidate its JWT/refresh token.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        - apple
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirects to /
        "400":
          description: Missing provider
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to log out from provider
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      summary: Log out of the OAuth2 provider session
      tags:
      - auth
  /auth/token/exchange:
    post:
      consumes:
      - application/json
      description: Exchanges the one-time opaque code from the deep link (see CallbackHandler)
        for the access/refresh token pair. The code is single-use with a 60-second
        TTL and is deleted on first use.
      parameters:
      - description: Opaque code from the deep link
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.authCodeExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: Missing or malformed code
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to retrieve auth code
          schema:
            $ref: '#/definitions/core.APIError'
      summary: Exchange a mobile auth code for a token pair
      tags:
      - auth
  /auth/token/refresh:
    post:
      consumes:
      - application/json
      description: Consumes the given refresh token and issues a fresh access/refresh
        pair. Reusing an already-rotated, revoked, or expired refresh token revokes
        its entire token family and returns 401.
      parameters:
      - description: Refresh token to rotate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: Missing or malformed refresh_token
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Refresh token invalid, expired, or reuse detected
          schema:
            $ref: '#/definitions/core.APIError'
      summary: Rotate a refresh token
      tags:
      - auth
  /auth/token/revoke:
    post:
      consumes:
      - application/json
      description: Blocklists the presented access token for its remaining lifetime.
        If a refresh_token is also supplied, revokes its entire token family too;
        refresh-family revocation failure is logged but non-fatal.
      parameters:
      - description: Optional refresh token to also revoke its family
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.revokeTokenRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to revoke token
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      summary: Revoke the caller's access token (and optionally a refresh token family)
