basePath: /
definitions:
  account.BotAccountRequest:
    properties:
      account:
        properties:
          avatar_url:
            type: string
          email:
            type: string
          name:
            maxLength: 100
            minLength: 1
            type: string
        required:
        - email
        - name
        type: object
      service_token:
        properties:
          description:
            type: string
          expires_in_days:
            maximum: 3650
            minimum: 1
            type: integer
          ip_whitelist:
            items:
              type: string
            type: array
          max_uses:
            minimum: 1
            type: integer
          metadata:
            additionalProperties: {}
            type: object
          name:
            maxLength: 100
            minLength: 1
            type: string
          rotation_policy:
            $ref: '#/definitions/servicetoken.RotationPolicy'
          scopes:
            items:
              type: string
            type: array
          user_agent_pattern:
            type: string
        required:
        - name
        type: object
    type: object
  account.BotAccountResponse:
    properties:
      account:
        properties:
          created_at:
            type: string
          email:
            type: string
          id:
            type: string
          name:
            type: string
          type:
            type: string
        type: object
      service_token:
        properties:
          created_at:
            type: string
          description:
            type: string
          expires_at:
            type: string
          id:
            type: string
          max_uses:
            type: integer
          metadata:
            additionalProperties: {}
            type: object
          name:
            type: string
          scopes:
            items:
              type: string
            type: array
          token:
            type: string
        type: object
    type: object
  auth.authCodeExchangeRequest:
    properties:
      code:
        type: string
    type: object
  auth.refreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.revokeTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.tokenResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  billing.CreateEntitlement:
