      scopes:
        items:
          type: string
        type: array
      user_agent_pattern:
        type: string
    type: object
  pagination.PaginatedResponse:
    properties:
      count:
        type: integer
      next:
        type: string
      previous:
        type: string
      results: {}
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Timestamp:
    properties:
