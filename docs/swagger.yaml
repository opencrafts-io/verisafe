  core.APIError:
    properties:
      error:
        example: the provided input is invalid or malformed
        type: string
    type: object
  device.DeviceOutput:
    properties:
      country:
        type: string
      created_at:
        type: string
      device_name:
        type: string
      device_token:
        type: string
      id:
        type: string
      ip_address:
        type: string
      last_active_at:
        type: string
      platform:
        type: string
      user_id:
        type: string
    type: object
  grants.GrantView:
    properties:
      available_capabilities:
        items:
          $ref: '#/definitions/providers.Capability'
        type: array
      connected_at:
        type: string
      expires_at:
        type: string
      external_user_id:
        type: string
      granted_capabilities:
        items:
          $ref: '#/definitions/providers.Capability'
        type: array
      granted_scopes:
        items:
          type: string
        type: array
      last_refreshed_at:
        type: string
      provider:
        type: string
      refresh_available:
        type: boolean
      revoked:
        type: boolean
      revoked_reason:
        type: string
      scopes_verified:
        type: boolean
      supports_incremental:
        type: boolean
    type: object
  oauth.InsufficientScopeResponse:
    properties:
      account_id:
        type: string
      authorization_body:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      authorization_method:
        type: string
      authorization_url:
        description: |-
          AuthorizationURL points at Verisafe's own scope-upgrade endpoint, not at
          the provider. It cannot be a directly openable provider URL: starting an
          authorization requires the *user's* JWT, which a service token holder
          does not have. The service relays this to its own client, which calls
          the endpoint with the user's token and opens the URL it returns.
        type: string
      error:
        type: string
      granted_capabilities:
        items:
          type: string
        type: array
      missing_capabilities:
        items:
          type: string
        type: array
      missing_scopes:
        items:
          type: string
        type: array
      provider:
        type: string
    type: object
  oauth.ProviderTokenRequest:
    properties:
      account_id:
        type: string
      capabilities:
        description: |-
          Capabilities are abstract names ("calendar"), not raw provider scopes.
          There is deliberately no raw-scope escape hatch: a caller needing
          something unmapped adds it to the provider registry, which keeps the
          registry authoritative and the insufficient_scope response meaningful.
        items:
          type: string
        type: array
    type: object
  oauth.ProviderTokenResponse:
    properties:
      access_token:
        type: string
      account_id:
        type: string
      expires_at:
        type: string
      expires_in:
        type: integer
      from_cache:
        type: boolean
      granted_scopes:
        items:
          type: string
        type: array
      provider:
        type: string
      refreshed:
        type: boolean
      scopes_verified:
        description: |-
          ScopesVerified is false when the scope list is still what Verisafe
          presumed from historical logins rather than what the provider confirmed.
          A caller that gets a 403 from the provider despite this being false
          should simply re-call the broker: the failed attempt will have converted
          the grant to verified.
        type: boolean
      token_type:
        type: string
    type: object
  oauth.ScopeAuthorizeRequest:
    properties:
      capabilities:
        description: |-
          Capabilities are abstract names ("calendar"), resolved to provider
          scopes by the registry.
        items:
          type: string
        type: array
      deep_link:
        description: DeepLink is where to return a mobile user. Must be allowlisted.
        type: string
      platform:
        description: Platform is "web" or "mobile"; mobile returns to a deep link.
        type: string
      redirect_uri:
        description: RedirectURI is where to return a web user. Must be allowlisted.
        type: string
    type: object
  oauth.ScopeAuthorizeResponse:
    properties:
      already_granted:
        description: |-
          AlreadyGranted short-circuits the round trip when the user has already
          granted everything asked for and the provider has confirmed it.
        type: boolean
      authorization_url:
        description: AuthorizationURL is empty when AlreadyGranted is true.
        type: string
      expires_at:
        type: string
      requested_scopes:
        items:
          type: string
        type: array
      state:
        type: string
    type: object
  oauth.ScopesResponse:
    properties:
      available_capabilities:
        additionalProperties:
          items:
            $ref: '#/definitions/providers.Capability'
          type: array
        description: |-
          AvailableCapabilities lets a settings UI render connect-this toggles
          generically, so adding a provider grows the UI with no client change.
        type: object
      grants:
        items:
          $ref: '#/definitions/grants.GrantView'
        type: array
    type: object
  pagination.PaginatedResponse:
    properties:
      count:
        type: integer
      next:
        type: string
      previous:
        type: string
      results: {}
    type: object
  providers.Capability:
    enum:
    - identity
    - calendar
    - tasks
    - playback
    - playlist
    - library
    type: string
    x-enum-varnames:
    - CapabilityIdentity
    - CapabilityCalendar
    - CapabilityTasks
    - CapabilityPlayback
    - CapabilityPlaylist
    - CapabilityLibrary
  repository.Account:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      national_id:
        type: string
      onboarded:
        type: boolean
      phone:
        type: string
      terms_accepted:
        type: boolean
      type:
