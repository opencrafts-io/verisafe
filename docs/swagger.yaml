  /api/v1/admin/service-tokens:
    get:
      description: Returns active service tokens across every account, as metadata
        only. Unlike the per-account listing this is not scoped to the caller, so
        it requires an admin permission.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/servicetoken.ServiceTokenResponse'
            type: array
        "500":
          description: Failed to list service tokens
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List all active service tokens (admin)
      tags:
      - service-tokens
  /api/v1/admin/service-tokens/cleanup:
    post:
      description: 'Sweeps expired service tokens across all accounts. Despite the
        name this is a soft delete: rows are retained and stamped with revoked_at,
        not removed. Housekeeping only, since an expired token already fails authentication
        before this runs. Returns 204 with no body on success.'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Failed to clean up expired tokens
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Delete expired service tokens (admin)
      tags:
      - service-tokens
  /api/v1/service-tokens:
    get:
      description: Returns the caller's service tokens as metadata only. Raw token
        values are never returned here, only at creation and rotation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/servicetoken.ServiceTokenResponse'
            type: array
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to list service tokens
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: List the authenticated account's own service tokens
      tags:
      - service-tokens
    post:
      consumes:
      - application/json
      description: Mints a service token for machine-to-machine calls, presented as
        X-Api-Key rather than a Bearer JWT. The raw token value is returned only in
        this response and is not recoverable afterwards; only its hash is stored.
      parameters:
      - description: Service token to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/servicetoken.ServiceTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Includes the raw token, only returned on creation
          schema:
            $ref: '#/definitions/servicetoken.ServiceTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "500":
          description: Failed to create service token
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      - ApiKey: []
      summary: Create a service token for the authenticated account
      tags:
      - service-tokens
  /api/v1/service-tokens/{id}:
    delete:
      description: Requires revoke:service_token:own for the caller's own tokens,
        or revoke:service_token:any for any account's token.
