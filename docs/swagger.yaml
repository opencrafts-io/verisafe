  /oauth/{provider}/authorize:
    post:
      consumes:
      - application/json
      description: Starts incremental authorization for the signed-in user and returns
        a provider URL to open. The user's session, devices and tokens are untouched
        — this grants a capability, it does not sign anyone in again. Returns already_granted
        when the user has already granted everything asked for. A URL is returned
        rather than a redirect because this endpoint needs the caller's Bearer token,
        which a browser navigation cannot supply and which mobile clients must hand
        to a Custom Tab or ASWebAuthenticationSession themselves.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        in: path
        name: provider
        required: true
        type: string
      - description: Capabilities to request and where to return the user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/oauth.ScopeAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oauth.ScopeAuthorizeResponse'
        "400":
          description: Unknown capability, provider without incremental support, or
            a redirect target that is not allowlisted
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: Unknown provider
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      summary: Begin authorizing additional provider capabilities
      tags:
      - oauth
  /oauth/{provider}/callback:
    get:
      description: 'Completes a scope upgrade started by the authorize endpoint. Not
        called by clients — the provider redirects the user''s browser here. Records
        the scopes the provider reports as granted and returns the user to the app.
        Deliberately issues no session: no token family, no device registration, no
        cookies, so the caller''s existing session survives the round trip.'
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        in: path
        name: provider
        required: true
        type: string
      - description: Opaque state handle issued by the authorize endpoint
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code from the provider
        in: query
        name: code
        type: string
      - description: Set when the user declined
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to the originating app with scope_upgrade=success
            or =denied
        "400":
          description: Missing, expired, replayed, or mismatched state
          schema:
            $ref: '#/definitions/core.APIError'
      summary: Provider callback for incremental authorization
      tags:
      - oauth
  /oauth/{provider}/grant:
    delete:
      description: Revokes the signed-in user's grant and destroys the stored credentials.
        Does not sign the user out; it only ends Verisafe's access to that provider
        on their behalf.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        - apple
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid claims
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: No grant for this provider
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - BearerToken: []
      summary: Disconnect a third-party provider
      tags:
      - oauth
  /oauth/{provider}/reconcile:
    post:
      consumes:
      - application/json
      description: Refreshes an account's grant purely to learn the scopes the provider
        reports, converting a presumed scope list into a verified one. Operational
        endpoint; the background reconciler does this automatically.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        in: path
        name: provider
        required: true
        type: string
      - description: Account to reconcile (capabilities ignored)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/oauth.ProviderTokenRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Malformed body or bad account_id
          schema:
            $ref: '#/definitions/core.APIError'
        "403":
          description: Lacks manage:provider_token:any
          schema:
            $ref: '#/definitions/core.APIError'
        "404":
          description: No grant for this account and provider
          schema:
            $ref: '#/definitions/core.APIError'
        "503":
          description: Provider is temporarily unavailable
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - ApiKey: []
      summary: Force a grant to be re-verified against the provider
      tags:
      - oauth
  /oauth/{provider}/token:
    post:
      consumes:
      - application/json
      description: Returns a usable provider access token for the given account, refreshing
        it against the provider if the stored one is stale. Requires a service token
        (X-API-Key) and the read:provider_token:any permission — a human Bearer JWT
        is rejected even if it holds the permission. Refresh tokens are never returned.
        When the user has not granted the requested capabilities, responds 403 with
        a machine-readable insufficient_scope body naming what is missing and where
        to send the user.
      parameters:
      - description: OAuth2 provider
        enum:
        - google
        - spotify
        in: path
        name: provider
        required: true
        type: string
      - description: Account and capabilities required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/oauth.ProviderTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oauth.ProviderTokenResponse'
        "400":
          description: Malformed body, bad account_id, or unknown capability
          schema:
            $ref: '#/definitions/core.APIError'
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/core.APIError'
        "403":
          description: Caller is not a service token, lacks the permission, or the
            user has not granted the capability
          schema:
            $ref: '#/definitions/oauth.InsufficientScopeResponse'
        "404":
          description: Unknown provider, or the account has never connected it
          schema:
            $ref: '#/definitions/core.APIError'
        "409":
          description: Provider cannot refresh tokens and the stored one has expired
          schema:
            $ref: '#/definitions/core.APIError'
        "503":
          description: Provider is temporarily unavailable
          schema:
            $ref: '#/definitions/core.APIError'
      security:
      - ApiKey: []
      summary: Obtain a third-party OAuth access token on behalf of a user
      tags:
      - oauth
  /oauth/grants:
    get:
      description: 'Pre-flight for the broker: which providers an account has connected
